name: tripeaks_neue
description: "A Tri Peaks patience (solitaire) game"

publish_to: 'none'

# Don't forget to increase version code (the number that comes after '+')
version: 0.9.3+8

environment:
  sdk: ^3.10.8

dependencies:
  audioplayers: ^6.5.1
  fast_rich_text: ^0.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_mobx: ^2.3.0
  intl: any
  logger: ^2.6.2
  mobx: ^2.5.0
  path_provider: ^2.1.5
  provider: ^6.1.5
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.10.5
  build_version: ^2.1.3
  flutter_lints: ^6.0.0
  dart_pubspec_licenses: ^3.0.7
  flutter_test:
    sdk: flutter
  mobx_codegen: ^2.7.6

flutter:
  uses-material-design: true
  generate: true

  assets:
    - images/tropy.png
    - images/empty.png
    - images/welcome.png
    - images/card_counter_dark.png
    - images/card_counter_light.png
    - sounds/take1.mp3
    - sounds/take2.mp3
    - sounds/take3.mp3
    - sounds/draw.mp3
    - sounds/undo.mp3
    - sounds/error.mp3
    - sounds/start.mp3
    - sounds/win.mp3
    - sounds/gameover.mp3

  fonts:
    - family: Actions
      fonts:
        - asset: fonts/actions.ttf
    - family: Cards
      fonts:
        - asset: fonts/cards.ttf
    - family: Outfit
      fonts:
        - asset: fonts/Outfit-VariableFont_wght.ttf
