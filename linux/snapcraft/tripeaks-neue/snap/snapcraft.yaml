name: mzoguz-tripeaksneue # you probably want to 'snapcraft register <name>'
title: TriPeaks NEUE
summary: Patience game  # 79 char long summary
icon: snap/gui/icon.svg
version: '0.9.62c' # just for humans, typically '1.2+git' or '1.3.2'
description: |
    A simple Tri Peaks patience (solitaire) game.

    Main Features:

    * Four board layouts
    * An option to show the values of face-down cards
    * An option to start with an empty discard pile, allowing the player to choose any starting card
    * An option to ensure the created games are solvable
    * Aggregated and per-layout statistics
    * Portrait and landscape orientation support

website: https://github.com/mimoguz/tripeaks_neue
source-code: https://github.com/mimoguz/tripeaks_neue
issues: https://github.com/mimoguz/tripeaks_neue/issues
license: AGPL-3.0-only
donation: https://buymeacoffee.com/mimoguz

base: core22 # the base snap is the execution environment for this snap
grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots

slots:
  dbus-mzoguz-tripeaksneue: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: io.github.mimoguz.tripeaksneue # adjust accordingly to your app name and

platforms:
    amd64:

apps:
  mzoguz-tripeaksneue:
    command: tripeaks_neue
    extensions: [gnome]
    plugs:
        - audio-playback
    slots:
        - dbus-mzoguz-tripeaksneue

parts:
    tripeaksneue:
        plugin: flutter
        source-type: git
        source: https://github.com/mimoguz/tripeaks_neue
        source-tag: v0.9.62
        flutter-target: lib/main.dart
        build-packages:
            - libgstreamer1.0-dev
            - libgstreamer-plugins-base1.0-dev
